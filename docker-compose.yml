services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.75}
    pids_limit: 100
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - huge_pages=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unity}
      POSTGRES_DB: ${POSTGRES_DB:-unity_run_club}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unity} -d ${POSTGRES_DB:-unity_run_club}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    mem_limit: ${REDIS_MEMORY_LIMIT:-96m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    pids_limit: 50
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - noeviction
      - --save
      - "300"
      - "10"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  api: &api-service
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: ${API_MEMORY_LIMIT:-256m}
    cpus: ${API_CPU_LIMIT:-1.0}
    pids_limit: 100
    env_file:
      - path: .env
        required: false
    environment: &api-environment
      PROCESS_ROLE: api
      PORT: "8080"
      DATABASE_MAX_CONN: ${DATABASE_MAX_CONN:-8}
      DATABASE_URL: postgres://${POSTGRES_USER:-unity}:${POSTGRES_PASSWORD:-unity}@postgres:5432/${POSTGRES_DB:-unity_run_club}?sslmode=disable
      REDIS_ADDR: redis:6379
      REALTIME_INTERNAL_URL: http://realtime:8081
      UPLOAD_DIR: /app/uploads
      GOMEMLIMIT: ${API_GO_MEMORY_LIMIT:-192MiB}
      GOMAXPROCS: ${API_GO_MAX_PROCS:-1}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - event_uploads:/app/uploads
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  api-replica:
    <<: *api-service

  # Exactly one worker: email sweeps are not safe to run concurrently.
  worker:
    <<: *api-service
    environment:
      <<: *api-environment
      PROCESS_ROLE: worker
      DATABASE_MAX_CONN: ${WORKER_DATABASE_MAX_CONN:-4}

  api-gateway:
    image: traefik:v3.7.12
    restart: unless-stopped
    init: true
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    cpus: ${GATEWAY_CPU_LIMIT:-0.25}
    pids_limit: 100
    command:
      - --entrypoints.api.address=:8080
      - --entrypoints.health.address=:9090
      - --providers.file.filename=/etc/traefik/api.yml
      - --ping=true
      - --ping.entrypoint=health
      - --accesslog=true
      - --accesslog.format=json
      - --log.format=json
    configs:
      - source: api-load-balancer
        target: /etc/traefik/api.yml
    ports:
      - "${PORT:-8080}:8080"
    # Start even if a replica is unhealthy; the gateway checks /ready itself.
    depends_on:
      api:
        condition: service_started
      api-replica:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: ${REALTIME_MEMORY_LIMIT:-96m}
    cpus: ${REALTIME_CPU_LIMIT:-0.25}
    pids_limit: 50
    environment:
      PORT: 8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      NODE_OPTIONS: --max-old-space-size=${REALTIME_NODE_HEAP_MB:-64}
    ports:
      - "${REALTIME_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  event_uploads:

configs:
  api-load-balancer:
    file: ./deploy/traefik/api.yml
