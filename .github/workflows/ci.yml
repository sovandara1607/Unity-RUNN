name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Run unit tests
        run: go test ./... -race -count=1

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unity
          POSTGRES_PASSWORD: unity
          POSTGRES_DB: unity_run_club
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unity -d unity_run_club"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://unity:unity@localhost:5432/unity_run_club?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - name: Apply migrations
        run: go run ./cmd/migrate up

      - name: Verify migration status
        run: go run ./cmd/migrate status

      - name: Run integration tests
        run: go test -tags=integration ./... -race -count=1 -p 1

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_REALTIME_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend end-to-end journeys
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:8081
      DATABASE_URL: postgres://unity:unity@127.0.0.1:5432/unity_run_club?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure backend environment
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 48)/" .env

      - name: Start application services
        run: docker compose up -d --build

      - name: Apply schema and seed journeys
        run: |
          make migrate
          make seed

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end journeys
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color --tail=200

  realtime:
    name: Realtime syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: realtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

  compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet
