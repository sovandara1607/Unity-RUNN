name: Publish client preview images

on:
  push:
    branches: [client-preview]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-client-preview-images
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    if: github.ref == 'refs/heads/client-preview'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: realtime
            context: realtime
            dockerfile: realtime/Dockerfile
            build_args: ""
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |-
              NEXT_PUBLIC_BASE_URL=https://api-preview.sovandara.lol
              NEXT_PUBLIC_REALTIME_URL=https://realtime-preview.sovandara.lol

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/unity-runn-${{ matrix.service }}:client-preview
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=client-preview-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=client-preview-${{ matrix.service }}

  deploy:
    name: Deploy client preview
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy after all images are published
        env:
          DOKPLOY_COMPOSE_WEBHOOK: ${{ secrets.DOKPLOY_COMPOSE_WEBHOOK }}
        run: |
          test -n "$DOKPLOY_COMPOSE_WEBHOOK"
          curl --fail --silent --show-error --request POST "$DOKPLOY_COMPOSE_WEBHOOK"
