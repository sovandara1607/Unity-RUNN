name: Publish dev-server images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - realtime/**
      - .github/workflows/publish-dev-images.yml
      - docker-compose.dokploy.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev-server-images
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: realtime
            context: realtime
            dockerfile: realtime/Dockerfile
            build_args: ""
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: |-
              NEXT_PUBLIC_BASE_URL=https://api-dev-server.sovandara.lol
              NEXT_PUBLIC_REALTIME_URL=https://realtime-dev-server.sovandara.lol

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/unity-runn-${{ matrix.service }}:dev-server
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=dev-server-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=dev-server-${{ matrix.service }}
