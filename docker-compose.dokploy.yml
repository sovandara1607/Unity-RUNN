x-api-image: &api-image
  image: ghcr.io/sovandara1607/unity-runn-api:${IMAGE_TAG:-dev-server}
  pull_policy: always

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.75}
    pids_limit: 100
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - huge_pages=off
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_DB: ${POSTGRES_DB:-unity_run_club}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging: &service-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    init: true
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.25}
    pids_limit: 50
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
    logging: *service-logging

  migrate:
    <<: *api-image
    restart: "no"
    entrypoint: ["./migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-unity}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-unity_run_club}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    logging: *service-logging

  api:
    <<: *api-image
    restart: unless-stopped
    init: true
    mem_limit: ${API_MEMORY_LIMIT:-384m}
    cpus: ${API_CPU_LIMIT:-1.0}
    pids_limit: 120
    environment:
      APP_ENV: ${APP_ENV:-staging}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-unity}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-unity_run_club}?sslmode=disable
      DATABASE_MAX_CONN: ${DATABASE_MAX_CONN:-10}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REALTIME_INTERNAL_URL: http://realtime:8081
      CORS_ALLOWED_ORIGINS: ${PUBLIC_APP_URL:-https://dev-server.sovandara.lol}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://dev-server.sovandara.lol}
      UPLOAD_DIR: /app/uploads
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      REMINDER_WINDOW: ${REMINDER_WINDOW:-24h}
      REMINDER_POLL_INTERVAL: ${REMINDER_POLL_INTERVAL:-15m}
      NOTIFICATION_SWEEP_INTERVAL: ${NOTIFICATION_SWEEP_INTERVAL:-30s}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      BAKONG_BASE_URL: ${BAKONG_BASE_URL:-}
      BAKONG_TOKEN: ${BAKONG_TOKEN:-}
      BAKONG_ACCOUNT_ID: ${BAKONG_ACCOUNT_ID:-}
      BAKONG_MERCHANT_ID: ${BAKONG_MERCHANT_ID:-}
      BAKONG_ACQUIRING_BANK: ${BAKONG_ACQUIRING_BANK:-}
      BAKONG_MERCHANT_NAME: ${BAKONG_MERCHANT_NAME:-UNITY RUNN CLUB}
      BAKONG_MERCHANT_CITY: ${BAKONG_MERCHANT_CITY:-PHNOM PENH}
      BAKONG_MCC: ${BAKONG_MCC:-5999}
      BAKONG_STORE_LABEL: ${BAKONG_STORE_LABEL:-UNITY RUNN CLUB}
      BAKONG_TERMINAL_LABEL: ${BAKONG_TERMINAL_LABEL:-WEB}
      BAKONG_PAYMENT_TTL: ${BAKONG_PAYMENT_TTL:-10m}
      GOMEMLIMIT: ${API_GO_MEMORY_LIMIT:-256MiB}
      GOMAXPROCS: ${API_GO_MAX_PROCS:-1}
    volumes:
      - event_uploads:/app/uploads
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *service-logging

  realtime:
    image: ghcr.io/sovandara1607/unity-runn-realtime:${IMAGE_TAG:-dev-server}
    pull_policy: always
    restart: unless-stopped
    init: true
    mem_limit: ${REALTIME_MEMORY_LIMIT:-128m}
    cpus: ${REALTIME_CPU_LIMIT:-0.25}
    pids_limit: 60
    environment:
      PORT: "8081"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      ALLOWED_ORIGINS: ${PUBLIC_APP_URL:-https://dev-server.sovandara.lol}
      NODE_OPTIONS: --max-old-space-size=${REALTIME_NODE_HEAP_MB:-96}
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *service-logging

  frontend:
    image: ghcr.io/sovandara1607/unity-runn-frontend:${IMAGE_TAG:-dev-server}
    pull_policy: always
    restart: unless-stopped
    init: true
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.75}
    pids_limit: 120
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *service-logging

volumes:
  postgres_data:
  redis_data:
  event_uploads:
